name: Windows emulator weekly

# Runs every test against the Windows emulator. The workflow of a pull request runs them on the Linux vNext emulator
# only, and the two emulators answer some queries differently, so this lane checks the expectations the tests state
# for the Windows emulator. It runs once a week, early on Monday, and on demand, and on a pull request only when the
# pull request changes this lane, so it never holds up other pull requests.
on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/windows-emulator-weekly.yml
      - .github/scripts/windows/**

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
      - name: Setup necessary dotnet SDKs
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            10.x

      - name: Install Azure Cosmos DB Emulator
        shell: pwsh
        run: ./.github/scripts/windows/install-cosmos-emulator.ps1

      - name: Start Azure Cosmos DB Emulator
        shell: pwsh
        run: ./.github/scripts/windows/start-cosmos-emulator.ps1

      - name: Build and test
        run: ./build.cmd DotnetTest
        env:
          CI: true
          CONFIGURATION: ${{ matrix.configuration }}
          ENABLE_COVERAGE: false
